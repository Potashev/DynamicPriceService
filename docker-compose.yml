services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2025-latest
    container_name: sqlserver
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=myStrongDevPassword!
    ports:
      - "1433:1433"
    volumes:
      - sql_data:/var/opt/mssql

  rabbitmq:
    image: rabbitmq:4.3.0-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  dynamicprice.core:
    container_name: dynamicprice.core
    build:
      context: .
      dockerfile: DynamicPrice.Core/Dockerfile
    depends_on:
      - sqlserver
      - rabbitmq
    ports:
      - "5001:8080"
    environment:
      - ASPNETCORE_URLS=http://+:8080

  dynamicprice.manager:
    container_name: dynamicprice.manager
    build:
      context: .
      dockerfile: DynamicPrice.Manager/Dockerfile
    depends_on:
      - dynamicprice.core
    ports:
      - "5002:8080"
    environment:
      - ASPNETCORE_URLS=http://+:8080
      - ApiSettings__BaseUrl=http://dynamicprice.core:8080

  dynamicprice.customer:
    container_name: dynamicprice.customer
    build:
      context: .
      dockerfile: DynamicPrice.Customer/Dockerfile
    depends_on:
      - dynamicprice.core
    ports:
      - "5003:8080"
    environment:
      - ASPNETCORE_URLS=http://+:8080
      - ApiSettings__BaseUrl=http://dynamicprice.core:8080

volumes:
  sql_data:
    name: dynamicpriceservice_sql_data

  rabbitmq_data:
    name: dynamicpriceservice_rabbitmq_data