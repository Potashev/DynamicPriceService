services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2025-latest
    container_name: sqlserver
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=yourStrong(!)Password
    ports:
      - "1433:1433"
    volumes:
      - sql_data:/var/opt/mssql

  dynamicprice.core:
    container_name: dynamicprice.core
    build:
      context: .
      dockerfile: DynamicPrice.Core/Dockerfile
    depends_on:
      - sqlserver
    ports:
      - "5001:8080"
    environment:
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DynamicPriceDb=Server=sqlserver,1433;Database=DynamicPriceDb;User Id=sa;Password=yourStrong(!)Password;TrustServerCertificate=True
      - ConnectionStrings__IdentityDb=Server=sqlserver,1433;Database=IdentityDb;User Id=sa;Password=yourStrong(!)Password;TrustServerCertificate=True

  dynamicprice.manager:
    container_name: dynamicprice.manager
    build:
      context: .
      dockerfile: DynamicPrice.Manager/Dockerfile
    depends_on:
      - dynamicprice.core
    ports:
      - "5002:8080"
    environment:
      - ASPNETCORE_URLS=http://+:8080
      - ApiSettings__BaseUrl=http://dynamicprice.core:8080

  dynamicprice.customer:
    container_name: dynamicprice.customer
    build:
      context: .
      dockerfile: DynamicPrice.Customer/Dockerfile
    depends_on:
      - dynamicprice.core
    ports:
      - "5003:8080"
    environment:
      - ASPNETCORE_URLS=http://+:8080
      - ApiSettings__BaseUrl=http://dynamicprice.core:8080

volumes:
  sql_data: