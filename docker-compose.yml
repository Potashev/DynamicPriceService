services:
  postgres:
    image: postgres:latest
    container_name: postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - 5432:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - sql_data:/var/lib/postgresql

  rabbitmq:
    image: rabbitmq:4.3.0-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5

  dynamicprice.core:
    build:
      context: .
      dockerfile: DynamicPrice.Core/Dockerfile
    container_name: dynamicprice.core
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "5001:8080"
    environment:
      - ASPNETCORE_URLS=http://+:8080

  dynamicprice.manager:
    build:
      context: .
      dockerfile: DynamicPrice.Manager/Dockerfile
    container_name: dynamicprice.manager
    depends_on:
      - dynamicprice.core
    ports:
      - "5002:8080"
    environment:
      - ASPNETCORE_URLS=http://+:8080
      - ApiSettings__BaseUrl=http://dynamicprice.core:8080

  dynamicprice.customer:
    build:
      context: .
      dockerfile: DynamicPrice.Customer/Dockerfile
    container_name: dynamicprice.customer
    depends_on:
      - dynamicprice.core
    ports:
      - "5003:8080"
    environment:
      - ASPNETCORE_URLS=http://+:8080
      - ApiSettings__BaseUrl=http://dynamicprice.core:8080

volumes:
  sql_data: